<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register your property | RKH ERP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:760px"><a href="/" class="text-decoration-none">← Back to home</a><section class="card shadow-sm border-0 mt-3"><div class="card-body p-4 p-md-5"><span class="badge text-bg-primary mb-2">Property Owner</span><h1 class="h3">Register a property</h1><p class="text-muted">Submit your property for review. Dashboard access is enabled only after Super Admin approval.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Owner name</label><input class="form-control" name="owner_name" required></div><div class="col-md-6"><label class="form-label">Property name</label><input class="form-control" name="property_name" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required></div><div class="col-md-6"><label class="form-label">Password</label><input type="password" minlength="8" class="form-control" name="password" required></div><div class="col-md-6"><label class="form-label">Requested plan</label><select class="form-select" name="plan_key">{% for key, plan in plans.items() %}<option value="{{ key }}">{{ plan.label }}</option>{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary">Submit for approval</button><a class="btn btn-outline-secondary ms-2" href="/admin-login">Existing owner login</a></div></form></div></section></main></body></html>
